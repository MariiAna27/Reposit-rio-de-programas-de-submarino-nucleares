site_name: Repositório de Documentos
site_description: Catálogo de documentos por país e programa, com links para as fontes originais
site_url: https://mariiana27.github.io/Reposit-rio-de-programas-de-submarino-nucleares/

theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Modo claro

plugins:
  - search:
      lang: pt
  - tags

extra_css:
  - assets/catalogo.css

extra_javascript:
  - assets/catalogo.js

nav:
  - Início: index.md
  - Catálogo: catalogo.md
  - Programas: programas/index.md
  - Países: paises/index.md
  - Palavras-chave: tags.md
